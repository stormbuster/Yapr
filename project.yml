name: Yapr
options:
  bundleIdPrefix: com.stormbuster
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  PhononCoreML:
    path: Vendor/phonon-coreml   # 1.1.2, patched to build for Intel; see Vendor/phonon-coreml/PATCHES.md
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    # One universal app: Apple silicon and Intel. Debug builds only the Mac you are on.
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"
targets:
  Yapr:
    type: application
    platform: macOS
    sources:
      - path: Yapr
        excludes:
          - designated.req
          - AppIcon.icon
          - AppIcon.icon/**
      # Icon Composer document: Liquid Glass app icon, compiled by Xcode into Assets.car and AppIcon.icns
      - path: Yapr/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: PhononCoreML
    info:
      path: Yapr/Info.plist
      properties:
        CFBundleDisplayName: Yapr
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Yapr listens to your microphone to transcribe what you say. Audio never leaves your Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio or video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.movie, public.audiovisual-content]
        NSHumanReadableCopyright: "Transcription by Phonon-2 (CC-BY-4.0, Fermion Research). Set in EB Garamond (OFL)."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stormbuster.yapr
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Yapr/Yapr.entitlements
        # Ad-hoc signatures are otherwise identified by their hash, so macOS would forget the microphone permission
        # on every rebuild; pinning the designated requirement to the bundle id keeps it.
        OTHER_CODE_SIGN_FLAGS: "-r $(SRCROOT)/Yapr/designated.req"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
